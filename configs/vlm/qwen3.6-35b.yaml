# Qwen (vLLM / OpenAI-compatible) — generation defaults
# These values apply unless overridden in the experiment config file.

# ── vLLM server settings ──────────────────────────────
# Used by run_vllm_server.sh when launching this model.
vllm_server:
  # Hugging Face Hub id; run_vllm_server.sh uses $MODELS_DIR/Qwen3.6-35B-A3B instead if it exists.
  model_path: "Qwen/Qwen3.6-35B-A3B"
  served_model_name: "qwen3.6-35b"
  port: 8787
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.90
  max_model_len: 100000
  disable_custom_all_reduce: true
  extra_args: "--reasoning-parser qwen3 --no-async-scheduling"
  extra_limit_mm: '{"video": 0}'
  # Avoid NCCL probing the host's RDMA NICs, which can hang init for TP>1
  # extra_env: "NCCL_IB_DISABLE=1 NCCL_P2P_DISABLE=1"
  extra_env: "NCCL_IB_DISABLE=1"

model: "${vllm_server.served_model_name}"
base_url: "http://${oc.env:VLM_HOST,localhost}:${vllm_server.port}/v1"
enable_thinking: False # Qwen3.6 thinking tokens, off in the paper

# Sampling parameters (vLLM-specific; passed via extra_body)
temperature: 0
top_p: 0.80
top_k: 20
min_p: 0.0
repetition_penalty: 1.0
presence_penalty: 1.5
max_tokens: 5000

