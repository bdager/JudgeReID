version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s - %(levelname)-6s - %(module)s:%(lineno)d - %(message)s"
    datefmt: "%H:%M:%S"
  detailed:
    format: "%(asctime)s - %(levelname)-8s - %(module)s:%(lineno)d - %(message)s"
    datefmt: "%d-%m-%Y %H:%M:%S"
  colored:
    (): "colorlog.ColoredFormatter"
    "format": "%(log_color)s%(asctime)s - [%(levelname)-5s] - %(module)s:%(lineno)d%(reset)s - %(message)s"
    datefmt: "%d-%m-%Y %H:%M:%S"
    log_colors:
      DEBUG: cyan
      INFO: green
      WARNING: yellow
      ERROR: red
      CRITICAL: bold_red,bg_white

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: colored
    stream: ext://sys.stdout

loggers:
  root:
    level: WARNING
    handlers: [console]
  matplotlib:
    level: WARNING
    propagate: false
  PIL:
    level: WARNING
    propagate: false
  urllib3:
    level: WARNING
    propagate: false
  httpx:
    level: WARNING
    propagate: false
  httpcore:
    level: WARNING
    propagate: false
  hpack:
    level: WARNING
    propagate: false
  transformers:
    level: WARNING
    propagate: false
  huggingface_hub:
    level: WARNING
    propagate: false
  openai:
    level: WARNING
    propagate: false
  mediapipe:
    level: ERROR
    propagate: false
  tensorflow:
    level: ERROR
    propagate: false
